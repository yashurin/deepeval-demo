# Local DeepEval demo.
#
#   ollama        official image, serves the open model on port 11434
#   deepeval-app  pulls that model, asks it questions, then scores the
#                 answers with DeepEval using the same model as the judge
#   deepeval-ui   Gradio page at http://localhost:${UI_PORT:-7860}
#
# No API keys. Model weights live in the ollama_models volume, so the
# download happens once.
#
# First run (stops Ollama when the report is done):
#   docker compose up --build --abort-on-container-exit

services:
  ollama:
    image: ollama/ollama:latest
    container_name: deepeval-ollama
    ports:
      # Reachable from your machine as http://localhost:${OLLAMA_PORT}.
      # The app container uses the Docker DNS name http://ollama:11434.
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
    healthcheck:
      # The image often sets OLLAMA_HOST=0.0.0.0:11434 so the server
      # listens on every interface. Point the CLI at localhost for the
      # check, or it tries to dial 0.0.0.0 and the container never
      # looks healthy. deepeval-app waits on this check.
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  deepeval-app:
    build: .
    container_name: deepeval-app
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      APP_TEMPERATURE: ${APP_TEMPERATURE:-0.2}
      JUDGE_TEMPERATURE: ${JUDGE_TEMPERATURE:-0}
      NUM_CTX: ${NUM_CTX:-8192}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-600}
      OLLAMA_RETRIES: ${OLLAMA_RETRIES:-2}
      ANSWER_RELEVANCY_THRESHOLD: ${ANSWER_RELEVANCY_THRESHOLD:-0.5}
      FAITHFULNESS_THRESHOLD: ${FAITHFULNESS_THRESHOLD:-0.5}
      CORRECTNESS_THRESHOLD: ${CORRECTNESS_THRESHOLD:-0.5}
      HELPFULNESS_THRESHOLD: ${HELPFULNESS_THRESHOLD:-0.5}
      CONTEXTUAL_RELEVANCY_THRESHOLD: ${CONTEXTUAL_RELEVANCY_THRESHOLD:-0.5}
      COMPARE_MODEL: ${COMPARE_MODEL:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-}
      METRICS: ${METRICS:-relevancy,faithfulness,correctness,helpfulness,contextual_relevancy}
      RUN_ASYNC: ${RUN_ASYNC:-false}
      IGNORE_EVAL_ERRORS: ${IGNORE_EVAL_ERRORS:-true}
      RESULTS_DIR: /app/results
      # A 2B model on CPU can spend minutes on one metric. DeepEval's
      # default task budget is 180s, which is too small here.
      DEEPEVAL_TELEMETRY_OPT_OUT: "1"
      DEEPEVAL_NO_INSPECT_PROMPT: "1"
      DEEPEVAL_DISABLE_TIMEOUTS: "1"
      DEEPEVAL_DISABLE_DOTENV: "1"
    volumes:
      # Edit the scripts on the host and re-run without rebuilding.
      - ./app:/app/app
      - ./results:/app/results
    # The first `docker compose up` pulls OLLAMA_MODEL when the volume
    # does not have it, then scores one question. The README shows the
    # full command and the comparison command.
    command: ["python", "-m", "app.evaluate", "--quick"]
    tty: true
    restart: "no"

  # Same image as deepeval-app. Started by `docker compose up`.
  # Open http://localhost:${UI_PORT:-7860}. Do not use --abort-on-container-exit
  # if you want this page to stay up: that flag stops every service when
  # the one-shot eval container exits.
  deepeval-ui:
    build: .
    container_name: deepeval-ui
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      APP_TEMPERATURE: ${APP_TEMPERATURE:-0.2}
      JUDGE_TEMPERATURE: ${JUDGE_TEMPERATURE:-0}
      NUM_CTX: ${NUM_CTX:-8192}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-600}
      OLLAMA_RETRIES: ${OLLAMA_RETRIES:-2}
      ANSWER_RELEVANCY_THRESHOLD: ${ANSWER_RELEVANCY_THRESHOLD:-0.5}
      FAITHFULNESS_THRESHOLD: ${FAITHFULNESS_THRESHOLD:-0.5}
      CORRECTNESS_THRESHOLD: ${CORRECTNESS_THRESHOLD:-0.5}
      HELPFULNESS_THRESHOLD: ${HELPFULNESS_THRESHOLD:-0.5}
      CONTEXTUAL_RELEVANCY_THRESHOLD: ${CONTEXTUAL_RELEVANCY_THRESHOLD:-0.5}
      COMPARE_MODEL: ${COMPARE_MODEL:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-}
      METRICS: ${METRICS:-relevancy,faithfulness,correctness,helpfulness,contextual_relevancy}
      RUN_ASYNC: ${RUN_ASYNC:-false}
      IGNORE_EVAL_ERRORS: ${IGNORE_EVAL_ERRORS:-true}
      RESULTS_DIR: /app/results
      DEEPEVAL_TELEMETRY_OPT_OUT: "1"
      DEEPEVAL_NO_INSPECT_PROMPT: "1"
      DEEPEVAL_DISABLE_TIMEOUTS: "1"
      DEEPEVAL_DISABLE_DOTENV: "1"
      GRADIO_ANALYTICS_ENABLED: "False"
      GRADIO_SERVER_PORT: "7860"
      # Port on the host. The process inside still listens on 7860.
      UI_PORT: ${UI_PORT:-7860}
    ports:
      - "${UI_PORT:-7860}:7860"
    volumes:
      - ./app:/app/app
      - ./results:/app/results
    command: ["python", "-m", "app.ui"]
    tty: true
    restart: unless-stopped

volumes:
  ollama_models:
